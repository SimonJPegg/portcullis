repos:
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v5.0.0
    hooks:
      - id: trailing-whitespace
        exclude: '\.svg$'
      - id: end-of-file-fixer
        exclude: '\.svg$'
      - id: check-yaml
        args: ['--allow-multiple-documents']
      - id: check-added-large-files
      - id: check-merge-conflict
  - repo: https://github.com/igorshubovych/markdownlint-cli
    rev: v0.44.0
    hooks:
      - id: markdownlint
        args: ['--fix', '--disable', 'MD013', 'MD024', 'MD033', 'MD040', 'MD041', '--']
  - repo: https://github.com/antonbabenko/pre-commit-terraform
    rev: v1.107.0
    hooks:
      - id: terraform_fmt
      - id: terraform_validate
  - repo: local
    hooks:
      - id: golangci-lint
        name: golangci-lint
        entry: bash -c 'cd backend && golangci-lint run'
        language: system
        pass_filenames: false
        always_run: true
        files: '\.go$'
      - id: go-test
        name: go test
        entry: bash -c 'cd backend && go test ./...'
        language: system
        pass_filenames: false
        always_run: true
        files: '\.go$'
      - id: eslint
        name: eslint
        entry: bash -c 'cd edge && npm run lint'
        language: system
        pass_filenames: false
        always_run: true
        files: '\.ts$'
